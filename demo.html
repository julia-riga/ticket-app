<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="frontend/public/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Система заявок — демо</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        color: #2d3748;
      }

      .app { max-width: 1000px; margin: 0 auto; padding: 30px 20px; }

      header {
        display: flex; justify-content: space-between; align-items: center;
        background: white; padding: 25px 30px; border-radius: 12px;
        margin-bottom: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      }

      header h1 { font-size: 28px; color: #2d3748; font-weight: 700; }

      .badge {
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        color: white; padding: 6px 14px; border-radius: 20px; font-size: 13px;
        margin-right: 12px; font-weight: 600; box-shadow: 0 2px 4px rgba(245, 87, 108, 0.3);
      }

      button {
        padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white; margin-left: 8px; font-weight: 600; font-size: 14px;
        transition: all 0.3s ease; box-shadow: 0 4px 6px rgba(102, 126, 234, 0.3);
      }

      button:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(102, 126, 234, 0.4); }
      button:active { transform: translateY(0); }

      button.danger {
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        box-shadow: 0 4px 6px rgba(245, 87, 108, 0.3);
      }

      button.danger:hover { box-shadow: 0 6px 12px rgba(245, 87, 108, 0.4); }

      .controls { margin-bottom: 20px; text-align: center; }
      .controls button { padding: 14px 28px; font-size: 16px; }

      .filters {
        display: flex; gap: 15px; margin-bottom: 25px; flex-wrap: wrap;
        background: white; padding: 20px; border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      }

      .filters input, .filters select {
        padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 8px;
        flex: 1; font-size: 15px; background: white; color: #2d3748; transition: all 0.3s ease;
      }

      .filters input:focus, .filters select:focus {
        outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .filters input { min-width: 200px; }

      .ticket {
        background: white; padding: 25px; border-radius: 12px; margin-bottom: 15px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: all 0.3s ease;
      }

      .ticket:hover { transform: translateY(-2px); box-shadow: 0 8px 12px rgba(0,0,0,0.15); }

      .ticket-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
      .ticket-head h3 { color: #2d3748; font-size: 22px; font-weight: 700; }

      .tag {
        padding: 6px 14px; border-radius: 20px; font-size: 12px; margin-left: 8px;
        font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
      }

      .status-new { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color: white; }
      .status-in_progress { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); color: white; }
      .status-done { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); color: white; }
      .priority-low { background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); color: #2d3748; }
      .priority-normal { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
      .priority-high { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; }

      .ticket p { color: #4a5568; margin-bottom: 15px; line-height: 1.6; font-size: 15px; }

      .ticket-foot {
        display: flex; justify-content: space-between; align-items: center;
        border-top: 2px solid #f0f0f0; padding-top: 15px; margin-top: 10px;
      }

      .ticket-foot small { color: #718096; font-size: 13px; }

      .ticket-foot select {
        padding: 8px 12px; border: 2px solid #e2e8f0; border-radius: 8px;
        margin-right: 8px; font-size: 14px; background: white; color: #2d3748; cursor: pointer;
      }

      .ticket-foot select:focus { outline: none; border-color: #667eea; }

      .form {
        background: white; padding: 30px; border-radius: 12px; margin-bottom: 25px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      }

      .form h2 { margin-bottom: 20px; color: #2d3748; font-size: 24px; }

      .form input, .form textarea, .form select {
        width: 100%; padding: 12px 16px; margin-bottom: 15px; border: 2px solid #e2e8f0;
        border-radius: 8px; font-size: 15px; transition: all 0.3s ease;
      }

      .form input:focus, .form textarea:focus, .form select:focus {
        outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .form textarea { min-height: 100px; resize: vertical; }
      .form div:last-child { display: flex; gap: 12px; margin-top: 10px; }

      .login-page {
        display: flex; justify-content: center; align-items: center; min-height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }

      .login-form {
        background: white; padding: 40px; border-radius: 16px; width: 360px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      }

      .login-form h2 { margin-bottom: 25px; text-align: center; color: #2d3748; font-size: 26px; }

      .login-form input {
        width: 100%; padding: 14px 16px; margin-bottom: 15px; border: 2px solid #e2e8f0;
        border-radius: 8px; font-size: 15px; transition: all 0.3s ease;
      }

      .login-form input:focus {
        outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .login-form button { width: 100%; padding: 14px; margin-left: 0; font-size: 16px; }

      .error {
        background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%); color: #c53030;
        padding: 14px 18px; border-radius: 8px; margin-bottom: 15px; font-size: 14px;
        border-left: 4px solid #f56565;
      }

      .loading, .empty {
        text-align: center; padding: 50px; color: #718096; background: white;
        border-radius: 12px; font-size: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      }

      .pagination {
        display: flex; justify-content: center; gap: 20px; margin-top: 25px; align-items: center;
        background: white; padding: 15px 25px; border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      }

      .pagination button { margin: 0; }
      .pagination span { font-weight: 600; color: #2d3748; }

      .demo-note {
        text-align: center; margin-top: 20px; color: rgba(255,255,255,0.85); font-size: 13px;
      }

      .login-note { text-align: center; margin-top: 18px; color: #718096; font-size: 13px; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script>
      // Демо без backend: данные и «авторизация» живут только в памяти вкладки.
      const STATUS_LABELS = { new: 'Новая', in_progress: 'В работе', done: 'Готово' };
      const PRIORITY_LABELS = { low: 'Низкий', normal: 'Обычный', high: 'Высокий' };
      const STATUS_OPTIONS = Object.entries(STATUS_LABELS);
      const PRIORITY_OPTIONS = Object.entries(PRIORITY_LABELS);
      // Заявку нельзя создать сразу закрытой — статус 'done' в форме создания не предлагаем
      const CREATE_STATUS_OPTIONS = STATUS_OPTIONS.filter(([value]) => value !== 'done');
      const PAGE_SIZE = 10;

      const seedTickets = [
        { id: 1, title: 'Починить вход в личный кабинет', description: 'Пользователи жалуются: после сброса пароля не пускает в кабинет.', status: 'in_progress', priority: 'high', created_at: '2026-11-05T08:12:00+00:00' },
        { id: 2, title: 'Обновить инструкцию для новых сотрудников', description: 'Добавить раздел про доступ к VPN.', status: 'new', priority: 'normal', created_at: '2026-11-06T09:40:00+00:00' },
        { id: 3, title: 'Настроить резервное копирование БД', description: 'Нужен ежедневный бэкап и проверка восстановления раз в неделю.', status: 'in_progress', priority: 'high', created_at: '2026-11-06T14:25:00+00:00' },
        { id: 4, title: 'Поправить вёрстку на мобильных', description: 'На узких экранах кнопки фильтров уезжают под карточку.', status: 'new', priority: 'low', created_at: '2026-11-07T07:05:00+00:00' },
        { id: 5, title: 'Добавить экспорт заявок в CSV', description: null, status: 'new', priority: 'normal', created_at: '2026-11-07T11:18:00+00:00' },
        { id: 6, title: 'Разобраться с медленной загрузкой списка', description: 'Список грузится 3 секунды при 500+ записях.', status: 'in_progress', priority: 'high', created_at: '2026-11-08T06:50:00+00:00' },
        { id: 7, title: 'Обновить логотип в шапке', description: 'Прислали новый вектор.', status: 'done', priority: 'low', created_at: '2026-11-03T10:00:00+00:00' },
        { id: 8, title: 'Проверить права администратора', description: 'Убедиться, что удалять заявки может только админ.', status: 'done', priority: 'normal', created_at: '2026-11-02T12:30:00+00:00' },
        { id: 9, title: 'Заказать новые ноутбуки для отдела', description: 'Три устройства взамен вышедших из строя.', status: 'new', priority: 'low', created_at: '2026-11-08T15:44:00+00:00' },
        { id: 10, title: 'Настроить уведомления по почте', description: 'Письмо при смене статуса заявки.', status: 'new', priority: 'normal', created_at: '2026-11-09T08:02:00+00:00' },
        { id: 11, title: 'Согласовать бюджет на квартал', description: null, status: 'in_progress', priority: 'normal', created_at: '2026-11-09T13:37:00+00:00' },
        { id: 12, title: 'Убрать старый сервер из мониторинга', description: 'Он больше не используется.', status: 'new', priority: 'low', created_at: '2026-11-10T09:15:00+00:00' },
      ];

      const state = {
        isLoggedIn: false,
        isAdmin: true,
        tickets: [],
        page: 1,
        search: '',
        statusFilter: '',
        priorityFilter: '',
        error: '',
        showForm: false,
        editing: null,
      };

      let nextId = 13;

      // Аналог поиска на backend: без учёта регистра, в том числе по кириллице
      const bySearch = (ticket, query) => {
        const q = query.trim().toLowerCase();
        if (!q) return true;
        return (ticket.title || '').toLowerCase().includes(q)
          || (ticket.description || '').toLowerCase().includes(q);
      };

      const filtered = () =>
        state.tickets
          .filter(t => bySearch(t, state.search))
          .filter(t => !state.statusFilter || t.status === state.statusFilter)
          .filter(t => !state.priorityFilter || t.priority === state.priorityFilter)
          .sort((a, b) => b.created_at.localeCompare(a.created_at));

      const escapeHtml = (value) => String(value)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

      const options = (list, selected, suffix = '') => list
        .map(([value, label]) =>
          `<option value="${value}"${value === selected ? ' selected' : ''}>${label}${suffix}</option>`)
        .join('');

      function renderLogin() {
        return `
          <div class="login-page">
            <form class="login-form" id="login-form">
              <h2>Вход в систему</h2>
              ${state.error ? `<div class="error">${escapeHtml(state.error)}</div>` : ''}
              <input name="username" placeholder="Логин (admin)" value="admin" required />
              <input name="password" type="password" placeholder="Пароль (admin)" value="admin" required />
              <button type="submit">Войти</button>
              <p class="login-note">Демо-режим: подойдут Логин <b>admin</b> / Пароль <b>admin</b></p>
            </form>
          </div>`;
      }

      function renderForm(ticket) {
        const isEdit = Boolean(ticket);
        return `
          <form class="form" id="ticket-form">
            <h2>${isEdit ? 'Редактировать' : 'Создать'} заявку</h2>
            <input name="title" placeholder="Заголовок (3-120 символов)" required minlength="3" maxlength="120"
              value="${isEdit ? escapeHtml(ticket.title) : ''}" />
            <textarea name="description" placeholder="Описание (необязательно)" maxlength="1000">${isEdit && ticket.description ? escapeHtml(ticket.description) : ''}</textarea>
            <select name="priority">
              ${options(PRIORITY_OPTIONS, isEdit ? ticket.priority : 'normal', ' приоритет')}
            </select>
            ${isEdit ? '' : `<select name="status">${options(CREATE_STATUS_OPTIONS, 'new')}</select>`}
            <div>
              <button type="submit">${isEdit ? 'Обновить' : 'Создать'}</button>
              <button type="button" class="js-cancel-form">Отмена</button>
            </div>
          </form>`;
      }

      function renderTicket(ticket) {
        const done = ticket.status === 'done';
        return `
          <div class="ticket">
            <div class="ticket-head">
              <h3>${escapeHtml(ticket.title)}</h3>
              <div>
                <span class="tag status-${ticket.status}">${STATUS_LABELS[ticket.status]}</span>
                <span class="tag priority-${ticket.priority}">${PRIORITY_LABELS[ticket.priority]}</span>
              </div>
            </div>
            ${ticket.description ? `<p>${escapeHtml(ticket.description)}</p>` : ''}
            <div class="ticket-foot">
              <small>${new Date(ticket.created_at).toLocaleString()}</small>
              <div>
                <select class="js-status" data-id="${ticket.id}"${done ? ' disabled' : ''}>
                  ${options(STATUS_OPTIONS, ticket.status)}
                </select>
                ${done ? '' : `
                  <button class="js-edit" data-id="${ticket.id}">Ред.</button>
                  ${state.isAdmin ? `<button class="danger js-delete" data-id="${ticket.id}">Удалить</button>` : ''}
                `}
              </div>
            </div>
          </div>`;
      }

      function renderApp() {
        const items = filtered();
        const totalPages = Math.max(1, Math.ceil(items.length / PAGE_SIZE));
        const page = Math.min(state.page, totalPages);
        const pageItems = items.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);
        const editing = state.editing ? state.tickets.find(t => t.id === state.editing) : null;

        return `
          <div class="app">
            <header>
              <h1>Система заявок</h1>
              <div>
                ${state.isAdmin ? '<span class="badge">Admin</span>' : ''}
                <button class="js-logout">Выйти</button>
              </div>
            </header>

            <div class="controls">
              <button class="js-toggle-form">${state.showForm ? 'Отмена' : '+ Новая заявка'}</button>
            </div>

            ${state.showForm ? renderForm(null) : ''}
            ${editing ? renderForm(editing) : ''}

            <div class="filters">
              <input class="js-search" placeholder="Поиск..." value="${escapeHtml(state.search)}" />
              <select class="js-status-filter">
                <option value="">Все статусы</option>
                ${options(STATUS_OPTIONS, state.statusFilter)}
              </select>
              <select class="js-priority-filter">
                <option value="">Любой приоритет</option>
                ${options(PRIORITY_OPTIONS, state.priorityFilter)}
              </select>
            </div>

            ${state.error ? `<div class="error">${escapeHtml(state.error)}</div>` : ''}
            ${pageItems.length === 0 ? '<div class="empty">Заявок нет</div>' : ''}

            <div class="tickets">
              ${pageItems.map(renderTicket).join('')}
            </div>

            ${totalPages > 1 ? `
              <div class="pagination">
                <button class="js-prev"${page === 1 ? ' disabled' : ''}>Назад</button>
                <span>Стр. ${page} из ${totalPages}</span>
                <button class="js-next"${page === totalPages ? ' disabled' : ''}>Вперед</button>
              </div>` : ''}

            <p class="demo-note">Демо-режим: данные хранятся только в этой вкладке и не отправляются на сервер.</p>
          </div>`;
      }

      function render() {
        document.getElementById('root').innerHTML = state.isLoggedIn ? renderApp() : renderLogin();
      }

      // --- Обработчики ---

      document.getElementById('root').addEventListener('submit', (event) => {
        if (event.target.id === 'login-form') {
          event.preventDefault();
          const username = event.target.username.value.trim();
          const password = event.target.password.value;
          if (username === 'admin' && password === 'admin') {
            state.isLoggedIn = true;
            state.isAdmin = true;
            state.error = '';
          } else {
            state.error = 'Неверный логин или пароль';
          }
          render();
          return;
        }

        if (event.target.id === 'ticket-form') {
          event.preventDefault();
          const form = event.target;
          const title = form.title.value.trim();
          const description = form.description.value.trim();
          const priority = form.priority.value;

          if (state.editing) {
            const ticket = state.tickets.find(t => t.id === state.editing);
            if (ticket) {
              ticket.title = title;
              ticket.description = description || null;
              ticket.priority = priority;
            }
            state.editing = null;
          } else {
            state.tickets.push({
              id: nextId++,
              title,
              description: description || null,
              status: form.status.value,
              priority,
              created_at: new Date().toISOString(),
            });
            state.showForm = false;
          }
          state.error = '';
          render();
        }
      });

      document.getElementById('root').addEventListener('click', (event) => {
        const target = event.target;
        const id = Number(target.dataset.id);

        if (target.classList.contains('js-logout')) {
          state.isLoggedIn = false;
          state.error = '';
          render();
        } else if (target.classList.contains('js-toggle-form')) {
          state.showForm = !state.showForm;
          state.editing = null;
          render();
        } else if (target.classList.contains('js-cancel-form')) {
          state.showForm = false;
          state.editing = null;
          render();
        } else if (target.classList.contains('js-edit')) {
          state.editing = id;
          state.showForm = false;
          render();
        } else if (target.classList.contains('js-delete')) {
          if (window.confirm('Удалить заявку?')) {
            state.tickets = state.tickets.filter(t => t.id !== id);
            render();
          }
        } else if (target.classList.contains('js-prev')) {
          state.page -= 1;
          render();
        } else if (target.classList.contains('js-next')) {
          state.page += 1;
          render();
        }
      });

      document.getElementById('root').addEventListener('change', (event) => {
        const target = event.target;

        if (target.classList.contains('js-status')) {
          const ticket = state.tickets.find(t => t.id === Number(target.dataset.id));
          if (ticket) {
            if (ticket.status === 'done') {
              state.error = 'Нельзя менять статус у выполненных заявок';
            } else {
              ticket.status = target.value;
              state.error = '';
            }
          }
          render();
        } else if (target.classList.contains('js-status-filter')) {
          state.statusFilter = target.value;
          state.page = 1;
          render();
        } else if (target.classList.contains('js-priority-filter')) {
          state.priorityFilter = target.value;
          state.page = 1;
          render();
        }
      });

      // Поиск с той же паузой 400 мс, что и в приложении
      let searchTimer = null;
      document.getElementById('root').addEventListener('input', (event) => {
        if (!event.target.classList.contains('js-search')) return;
        const value = event.target.value;
        state.search = value;
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          state.page = 1;
          const input = document.querySelector('.js-search');
          if (input) input.value = state.search;
          render();
        }, 400);
      });

      state.tickets = seedTickets.map(t => ({ ...t }));
      render();
    </script>
  </body>
</html>
